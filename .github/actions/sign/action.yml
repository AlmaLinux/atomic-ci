    #   if: ${{ inputs.signing-secret != '' }}
    #   env:
    #     IMAGE_REF: ${{ inputs.image-ref }}
    #   shell: bash
    #   run: |
    #     REPOSITORY="${IMAGE_REF%@*}"
    #     jq -n --arg repository "${REPOSITORY}" '{
    #       default: [{type: "reject"}],
    #       transports: {
    #         docker: {($repository): [{type: "sigstoreSigned", keyPath: "/verify/cosign.pub", signedIdentity: {type: "matchRepository"}}]},
    #         dir: {"": [{type: "insecureAcceptAnything"}]}
    #       }
    #     }' > "${RUNNER_TEMP}/verify-policy.json"
    #     printf 'docker:\n  %s:\n    use-sigstore-attachments: true\n' "${REPOSITORY}" > "${RUNNER_TEMP}/verify-registry.yaml"
    #
    #     podman run --rm \
    #       -v "${RUNNER_TEMP}/cosign.pub":/verify/cosign.pub:ro \
    #       -v "${RUNNER_TEMP}/verify-policy.json":/verify/policy.json:ro \
    #       -v "${RUNNER_TEMP}/verify-registry.yaml":/etc/containers/registries.d/verify.yaml:ro \
    #       -v "${REGISTRY_AUTH_FILE:-${XDG_RUNTIME_DIR}/containers/auth.json}":/run/containers/0/auth.json:ro \
    #       "${IMAGE_REF}" \
    #       skopeo --policy /verify/policy.json copy "docker://${IMAGE_REF}" dir:/tmp/verify
