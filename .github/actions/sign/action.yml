---
name: Sign image
description: Sign a container image with a signing key

inputs:
  signing-secret:
    description: The secret used for signing the image
    required: true
  image-ref:
    description: The reference to the image to sign
    required: true
  sbom-path:
    description: The path to the SBOM file to sign
    required: false
  KMS_KEY_ALIAS:
    description: The AWS KMS alias to use for signing
    required: false
  AWS_ROLE_ARN:
    description: The AWS role ARN to assume for signing
    required: false
  AWS_REGION:
    description: The AWS region to use for signing
    required: false

runs:
  using: "composite"
  steps:
    - name: Install Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: 'v2.6.5'

    - name: Sign Image with Signing Secret
      if: ${{ inputs.signing-secret != '' }}
      env:
        COSIGN_PRIVATE_KEY: ${{ inputs.signing-secret }}
        IMAGE_REF: ${{ inputs.image-ref }}
      shell: bash
      run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE_REF}"

    # - name: SBOM Attestation with Signing Secret
    #   if: ${{ inputs.signing-secret != '' && inputs.sbom-path != '' }}
    #   env:
    #     COSIGN_PRIVATE_KEY: ${{ inputs.signing-secret }}
    #     SBOM_OUTPUT: ${{ inputs.sbom-path }}
    #   shell: bash
    #   run: |
    #     cd "$(dirname "$SBOM_OUTPUT")"
    #     cosign attest --yes \
    #       --tlog-upload=false \
    #       --predicate ./*.spdx.json \
    #       --type spdxjson \
    #       --key env://COSIGN_PRIVATE_KEY \
    #       ${{ inputs.image-ref }}

    - name: Configure AWS credentials
      if: ${{ inputs.AWS_ROLE_ARN != '' && inputs.AWS_REGION != '' && inputs.KMS_KEY_ALIAS != '' }}
      id: configure-aws
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.AWS_ROLE_ARN }}
        role-session-name: almalinux-bootc-signing-${{ github.run_id }}
        aws-region: ${{ inputs.AWS_REGION }}
        role-duration-seconds: 900  # 15 minutes, the minimum
        mask-aws-account-id: true

    - name: Sign Image with KMS
      if: ${{ env.AWS_SESSION_TOKEN != '' }}
      env:
        KMS_KEY_ALIAS: ${{ inputs.KMS_KEY_ALIAS }}
        IMAGE_REF: ${{ inputs.image-ref }}
      shell: bash
      run: cosign sign --yes --key "awskms:///alias/${KMS_KEY_ALIAS}" "${IMAGE_REF}"

    # - name: SBOM Attestation with KMS
    #   if: ${{ env.AWS_SESSION_TOKEN != '' && inputs.sbom-path != '' }}
    #   env:
    #     SBOM_OUTPUT: ${{ inputs.sbom-path }}
    #   shell: bash
    #   run: |
    #     cd "$(dirname "$SBOM_OUTPUT")"
    #     cosign attest --yes --verbose \
    #       --tlog-upload=false \
    #       --predicate ./*.spdx.json \
    #       --type spdxjson \
    #       --key awskms:///alias/${{ inputs.KMS_KEY_ALIAS }} \
    #       ${{ inputs.image-ref }}

    # Systems only accept an update if they can find and verify its signature, so make sure that
    # what was just pushed is what they expect. Verifying with cosign is not enough: the
    # containers library used by bootc and podman only reads the signatures stored in the
    # "sha256-<digest>.sig" tag, and newer versions of cosign store them in a different format by
    # default, which cosign itself is happy to verify. That left systems unable to update before.
    - name: Verify signature
      if: ${{ inputs.signing-secret != '' || env.AWS_SESSION_TOKEN != '' }}
      env:
        COSIGN_PRIVATE_KEY: ${{ inputs.signing-secret }}
        KMS_KEY_ALIAS: ${{ inputs.KMS_KEY_ALIAS }}
        IMAGE_REF: ${{ inputs.image-ref }}
      shell: bash
      run: |
        # The signature is stored where the containers library looks for it
        SIGNATURE_REF="${IMAGE_REF%@*}:$(echo "${IMAGE_REF#*@}" | tr ':' '-').sig"
        if ! skopeo inspect --raw "docker://${SIGNATURE_REF}" > /dev/null; then
          echo "::error::No signature found in ${SIGNATURE_REF}, systems would refuse to update to this image"
          exit 1
        fi
        echo "Found the signature in ${SIGNATURE_REF}"

        # The signature is valid for the keys used to sign
        if [[ -n "${COSIGN_PRIVATE_KEY}" ]]; then
          cosign public-key --key env://COSIGN_PRIVATE_KEY > "${RUNNER_TEMP}/cosign.pub"
          cosign verify --key "${RUNNER_TEMP}/cosign.pub" "${IMAGE_REF}" > /dev/null
        fi
        if [[ -n "${AWS_SESSION_TOKEN}" ]]; then
          cosign verify --key "awskms:///alias/${KMS_KEY_ALIAS}" "${IMAGE_REF}" > /dev/null
        fi

    # A stricter version of the check above: pull the image with the tools of the image itself
    # (the same ones an installed system uses) and a policy that requires the signature. It
    # downloads the whole image again, which is why it's disabled. For a multi-platform manifest
    # only the manifest is signed, add --multi-arch=index-only to skopeo to check just that.
    # Needs the public key in ${RUNNER_TEMP}/cosign.pub, the step above creates it when signing
    # with a signing secret.
