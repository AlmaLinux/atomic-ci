---
name: Prepare Build
description: |
  This action prepares the build environment by setting up the matrix for platforms,
  extracting the upstream image, and verifying its signature if provided.

inputs:
  platforms:
    description: Comma-separated list of platforms to build for (e.g., "amd64,arm64")
    required: true
  containerfile:
    description: Path to the Containerfile to use for extracting the upstream image
    required: true
  upstream-public-key:
    description: Public key for verifying the upstream image signature (optional)
    required: false

outputs:
  matrix:
    description: The matrix of platforms to build for
    value: ${{ steps.set-matrix.outputs.matrix }}
  tag:
    description: The working tag derived from the Git reference name
    value: ${{ steps.set-matrix.outputs.WORKING_TAG }}

runs:
  using: "composite"
  steps:
    - name: Set matrix
      id: set-matrix
      env:
        PLATFORMS: ${{ inputs.platforms }}
        REF_NAME: ${{ github.ref_name }}
      shell: bash
      run: |
        # Turn the comma separated string into a matrix
        echo "matrix=$(jq -cn --arg platforms "${PLATFORMS}" '{include: ($platforms | split(",") | map({platform: .}))}')" >> $GITHUB_OUTPUT

        WORKING_TAG="${REF_NAME}"
        echo "WORKING_TAG=${WORKING_TAG//\//_}" >> "$GITHUB_OUTPUT"

    - name: Install Cosign
      if: ${{ inputs.upstream-public-key != '' }}
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: 'v2.6.5'

    - name: Extract upstream
      if: ${{ inputs.upstream-public-key != '' }}
      id: extract
      shell: bash
      env:
        CONTAINERFILE: ${{ inputs.containerfile }}
      run: |
        # Extract the image of the last FROM, following references to previous build stages
        upstream=$(python3 - << 'EOF'
        import os, re

        with open(os.environ["CONTAINERFILE"]) as f:
            # Join continuation lines
            content = re.sub(r"\\[ \t]*\n", " ", f.read())

        # (image, stage name) of each FROM, skipping options like --platform
        froms = re.findall(r"^\s*FROM\s+(?:--\S+\s+)*(\S+)(?:\s+AS\s+(\S+))?", content, re.I | re.M)
        upstream = froms[-1][0]
        for image, name in reversed(froms):
            if name and name.lower() == upstream.lower():
                upstream = image
        print(upstream)
        EOF
        )
        echo "upstream-image=$upstream" >> $GITHUB_OUTPUT

    - name: Verify signature
      if: ${{ inputs.upstream-public-key != '' }}
      id: verify
      env:
        UPSTREAM_PUBLIC_KEY: ${{ inputs.upstream-public-key }}
      shell: bash
      run: |
        echo "Verifying signature for ${{ steps.extract.outputs.upstream-image }}"
        cosign verify --key "${UPSTREAM_PUBLIC_KEY}" ${{ steps.extract.outputs.upstream-image }} | jq .
