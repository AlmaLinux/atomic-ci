---
name: Image Build Action
description: Build and push a container image to a registry, and generate a changelog.

inputs:
  platform:
    description: The platform to build the image for (e.g., "x86_64", "arm64")
    required: true
  variant:
    description: The variant of the image to build
    required: true
  containerfile:
    description: The path to the Containerfile used for building the image
    required: true
  image-name:
    description: The name of the image to build
    required: true
  image-path:
    description: The path where the image will be stored in the registry
    required: true
  image-tag:
    description: The tag for the image
    required: true
  image-description:
    description: A description of the image
    required: true
  previous-image:
    description: The previous image to compare against
    required: true
  skip-maximize-build-space:
    description: Whether to skip maximizing build space
    required: false
  docs-url:
    description: The URL to the documentation for the image
    required: true
  changelog-snippet:
    description: A snippet to include in the changelog
    required: true
  REGISTRY:
    description: The container registry URL (e.g., "registry.example.com")
    required: true
  REGISTRY_USER:
    description: The username for the container registry login
    required: true
  REGISTRY_TOKEN:
    description: The token for authenticating with the container registry
    required: true

outputs:
  image-id:
    description: The ID of the built image
    value: ${{ steps.load.outputs.image-id }}
  image-ref:
    description: The reference to the pushed image in the registry
    value: ${{ steps.set-env.outputs.image-ref }}
  digest:
    description: The digest of the pushed image
    value: ${{ steps.push.outputs.digest }}
  redhat-id:
    description: The Red Hat ID from the image labels
    value: ${{ steps.load.outputs.redhat-id }}
  redhat-version-id:
    description: The Red Hat version ID from the image labels
    value: ${{ steps.load.outputs.redhat-version-id }}
  major-version:
    description: The major version extracted from the Red Hat version ID
    value: ${{ steps.load.outputs.redhat-major-version }}
  version:
    description: The version of the image
    value: ${{ steps.load.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Set up environment
      id: set-env
      shell: bash
      run: |
        ARCH=${{ inputs.platform }}
        echo "CLEAN_ARCH=${ARCH//\//_}" >> "$GITHUB_ENV"

        lowercase_ref=$(echo "${{ inputs.REGISTRY }}/${{ inputs.image-path }}/${{ inputs.image-name }}" | tr '[:upper:]' '[:lower:]')
        echo "image-ref=${lowercase_ref}" >> $GITHUB_OUTPUT

    - name: Login to Container Registry
      uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
      with:
        registry: ${{ inputs.REGISTRY }}
        username: ${{ inputs.REGISTRY_USER }}
        password: ${{ inputs.REGISTRY_TOKEN }}

    - name: Maximize build space
      if: ${{ inputs.platform != 'arm64' && inputs.skip-maximize-build-space != 'true' }}
      uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # v10 when it gets tagged
      with:
        extra-squeeze: false

    - name: Build image
      id: build
      shell: bash
      env:
        IMAGE_TAG: ${{ inputs.image-tag }}-${{ env.CLEAN_ARCH }}
      run: |
        echo "::group::Build Image"
        sudo podman build \
          --platform=linux/${{ inputs.platform }} \
          --security-opt=label=disable \
          --cap-add=all \
          --device /dev/fuse \
          --timestamp=0 \
          --iidfile /tmp/image-id \
          --build-arg IMAGE_NAME=${{ inputs.image-name }} \
          --build-arg IMAGE_REGISTRY=${{ inputs.REGISTRY }}/${{ inputs.image-path }} \
          --build-arg VARIANT=${{ inputs.variant }} \
          -t ${{ inputs.image-name }}:${IMAGE_TAG} \
          -f ${{ inputs.containerfile }} \
          .

        echo "image-id=$(cat /tmp/image-id)" >> $GITHUB_OUTPUT
        echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT
        echo "::endgroup::"

    - name: Check image
      id: check
      shell: bash
      env:
        IMAGE_ID: ${{ steps.build.outputs.image-id }}
      run: |
        echo "::group::Check Image"
        INSPECT=$(sudo podman image inspect ${{ env.IMAGE_ID }} )
        echo $INSPECT | jq .
        echo "redhat-id=$(echo "$INSPECT" | jq -r '.[0].Labels["redhat.id"]')" >> $GITHUB_OUTPUT
        echo "redhat-version-id=$(echo "$INSPECT" | jq -r '.[0].Labels["redhat.version-id"]')" >> $GITHUB_OUTPUT
        echo "major-version=$(echo "$INSPECT" | jq -r '.[0].Labels["redhat.version-id"]' | cut -d. -f1)" >> $GITHUB_OUTPUT
        echo "version=$(echo "$INSPECT" | jq -r '.[0].Labels["org.opencontainers.image.version"]')" >> $GITHUB_OUTPUT

        sudo podman run --platform=linux/${{ inputs.platform }} --rm ${{ env.IMAGE_ID }} bash -c "rpm -q almalinux-gpg-keys && cat /etc/os-release"

        # Package list (name -> version-release), used for the changelog and stored in the image labels
        sudo podman run --platform=linux/${{ inputs.platform }} --rm ${{ env.IMAGE_ID }} rpm -qa --qf '%{NAME}\t%{VERSION}-%{RELEASE}\n' \
          | jq -Rn '[inputs | split("\t") | {key: .[0], value: .[1]}] | reverse | from_entries' > /tmp/packages.json
        echo "::endgroup::"

    # Respins built from older templates run `mv /usr/local /var/usrlocal` on top of a base image
    # where /usr/local is already a symlink to /var/usrlocal (and /var is empty). That moves the
    # symlink itself, leaving /var/usrlocal pointing at itself. Since /usr/local/{bin,sbin} are in
    # the PATH, the loop breaks `/usr/bin/env` lookups, which bootc-base-imagectl needs to rechunk
    # the image, and it would also ship a broken /usr/local to users. Removing the looping symlink
    # restores the state of the base image.
    # This is fixed in https://github.com/AlmaLinux/atomic-respin-template/commit/396969c4 as of 2026-10-04,
    # once this is far enough in the past, we can remove this step.
    - name: Fix /usr/local symlink loop
      id: fix
      shell: bash
      env:
        IMAGE_ID: ${{ steps.build.outputs.image-id }}
      run: |
        echo "::group::Fix /usr/local symlink loop"
        if sudo podman run --platform=linux/${{ inputs.platform }} --rm ${IMAGE_ID} bash -c '[[ "$(readlink /var/usrlocal)" == /var/usrlocal ]]'; then
          echo "::warning::/var/usrlocal is a symlink to itself, removing it. Update files/scripts/cleanup.sh from the respin template to fix this in your image."
          mkdir -p /tmp/empty-context
          printf 'FROM %s\nRUN rm /var/usrlocal\n' "${IMAGE_ID#sha256:}" | sudo podman build \
            --platform=linux/${{ inputs.platform }} \
            --pull=never \
            --security-opt=label=disable \
            --iidfile /tmp/image-id \
            -f - \
            /tmp/empty-context
          IMAGE_ID=$(cat /tmp/image-id)
        fi
        echo "image-id=${IMAGE_ID}" >> $GITHUB_OUTPUT
        echo "::endgroup::"

    - name: Prepare previous image
      id: prep-prev
      shell: bash
      run: |
        PREVIOUS_IMAGE=$(echo ${{ inputs.previous-image }} | tr '[:upper:]' '[:lower:]')

        # If the previous image is a multi-arch image, we need to find the digest for the current platform
        # skopeo won't necessarily pick the right one, so we need to do it manually
        platform=${{ inputs.platform }}
        JQ_FILTER=".manifests[] | select(.platform.architecture==\"${platform%/*}\" and "
        if [[ "$platform" = */v* ]]; then
          JQ_FILTER+=".platform.variant==\"${platform#*/}\""
        else
          JQ_FILTER+="(.platform | has(\"variant\") | not)"
        fi
        JQ_FILTER+=") | .digest"

        DIGEST=$(skopeo inspect --no-tags --raw docker://${PREVIOUS_IMAGE} | jq -er "${JQ_FILTER}" 2>/dev/null || echo "")

        # If DIGEST isn't empty, it's because the previous image was a manifest list and we found the one for the current platform
        if [[ -n "$DIGEST" ]]; then
          echo "Image ${PREVIOUS_IMAGE} contains an image for platform $platform, using it: ${PREVIOUS_IMAGE/%[:@]*/}@${DIGEST}"
          PREVIOUS_IMAGE="${PREVIOUS_IMAGE/%[:@]*/}@${DIGEST}"
        fi

        echo "PREVIOUS_IMAGE=${PREVIOUS_IMAGE}" >> $GITHUB_ENV

        # Labels and tags of the previous image, used for versioning and the changelog
        skopeo inspect docker://${PREVIOUS_IMAGE} > /tmp/previous.json || echo '{}' > /tmp/previous.json

    - name: Generate changelog
      id: changelog
      shell: bash
      env:
        VERSION: ${{ steps.check.outputs.version }}
        PRETTY: ${{ steps.check.outputs.redhat-version-id }}
        CHANGELOG_SNIPPET: ${{ inputs.changelog-snippet }}
        CHANGELOG: /tmp/changelog-${{ inputs.image-name }}-${{ env.CLEAN_ARCH }}.txt
        INFO_LABEL: dev.hhd.rechunk.info # Kept from hhd-dev/rechunk, so we can compare against older images
      run: |
        echo "::group::Generate changelog"
        PREV=/tmp/previous.json
        PREV_VERSION=$(jq -r '.Labels["org.opencontainers.image.version"] // empty' $PREV)
        PREV_REVISION=$(jq -r --arg l $INFO_LABEL '(.Labels[$l] // "{}" | fromjson | .revision) // .Labels["org.opencontainers.image.revision"] // empty' $PREV)
        has_tag() { jq -e --arg v "$1" '(.RepoTags // []) | index($v)' $PREV > /dev/null; }

        # If the previous image has the same version, suffix it with .1, .2, etc.
        if [[ "$VERSION" == "$PREV_VERSION" ]] || has_tag "$VERSION"; then
          if [[ ${#VERSION} -gt 3 && "${VERSION: -2:1}" == "." ]]; then
            VERSION=${VERSION%.?}
          fi
          for i in {1..9}; do
            has_tag "$VERSION.$i" || break
          done
          VERSION="$VERSION.$i"
        fi
        echo "New version: $VERSION, previous version: $PREV_VERSION"

        COMMITS=""
        if [[ -n "$PREV_REVISION" ]]; then
          COMMITS=$(git log --format='- **%h** %s' --no-merges "$PREV_REVISION..${{ github.sha }}" || true)
        fi

        PKGUPD=$(jq -r --arg l $INFO_LABEL --slurpfile new /tmp/packages.json '
          def ver: sub("-[^-]*$"; "");
          (.Labels[$l] // "{}" | fromjson | .packages // {}) as $old | $new[0] as $new
          | if $old == {} then empty else
              ($new | to_entries[] | select($old[.key] == null) | " - **\(.key)**: x → \(.value | ver)"),
              ($new | to_entries[] | select($old[.key] != null and $old[.key] != .value) | $old[.key] as $o
                | if ($o | ver) != (.value | ver) then " - **\(.key)**: \($o | ver) → \(.value | ver)"
                  else " - **\(.key)**: \($o) → \(.value)" end),
              ($old | to_entries[] | select($new[.key] == null) | " - **\(.key)**: \(.value | ver) → x")
            end' $PREV)

        # Replace <version:pkg> and <relver:pkg> in the snippet with the package versions
        SNIPPET=$(jq -rn --arg s "$CHANGELOG_SNIPPET" --slurpfile pkgs /tmp/packages.json '
          reduce ($s | [scan("<(version|relver):([^>]+)>")] | unique[]) as [$kind, $name] ($s;
            $pkgs[0][$name] as $v
            | if $v then split("<\($kind):\($name)>") | join(if $kind == "version" then $v | sub("-[^-]*$"; "") else $v end) else . end)')

        cat > $CHANGELOG <<EOF
        ## Changelog ${{ inputs.image-name }} ${PRETTY} ${{ inputs.platform }}
        ### Version: ${VERSION}
        ${SNIPPET}

        ### Changes since last version (${PREV_VERSION:-<previous>}):
        #### Commits
        ${COMMITS:--}

        #### Package Changes
        ${PKGUPD:--}

        EOF
        cat $CHANGELOG

        jq -c --arg uniq "$VERSION" --arg revision "${{ github.sha }}" \
          '{version: 2, uniq: $uniq, packages: ., revision: $revision}' /tmp/packages.json > /tmp/image-info.json

        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT
        echo "::endgroup::"

    - name: Run Rechunker
      id: rechunk
      shell: bash
      env:
        IMAGE_ID: ${{ steps.fix.outputs.image-id }}
        IMAGE_DESCRIPTION: ${{ inputs.image-description }}
        LABELED: localhost/${{ inputs.image-name }}:labeled
        RECHUNKED: localhost/${{ inputs.image-name }}:rechunked
        OUT_DIR: /tmp/rechunked
      run: |
        echo "::group::Label Image"
        # bootc-base-imagectl keeps the labels of the source image, so they need to be set before rechunking
        mkdir -p /tmp/empty-context
        echo "FROM ${IMAGE_ID#sha256:}" | sudo podman build \
          --platform=linux/${{ inputs.platform }} \
          --pull=never \
          --label "redhat.id=${{ steps.check.outputs.redhat-id }}" \
          --label "redhat.version-id=${{ steps.check.outputs.redhat-version-id }}" \
          --label "redhat.major-version=${{ steps.check.outputs.major-version }}" \
          --label "org.opencontainers.image.created=${{ steps.build.outputs.date }}" \
          --label "org.opencontainers.image.description=${IMAGE_DESCRIPTION}" \
          --label "org.opencontainers.image.documentation=${{ inputs.docs-url }}" \
          --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
          --label "org.opencontainers.image.revision=${{ github.sha }}" \
          --label "org.opencontainers.image.title=${{ inputs.image-name }}" \
          --label "org.opencontainers.image.url=${{ github.event.repository.html_url }}" \
          --label "org.opencontainers.image.vendor=${{ github.repository_owner }}" \
          --label "org.opencontainers.image.version=${{ steps.changelog.outputs.version }}" \
          --label "dev.hhd.rechunk.info=$(cat /tmp/image-info.json)" \
          -t $LABELED \
          -f - \
          /tmp/empty-context
        echo "::endgroup::"

        echo "::group::Rechunk Image"
        # rpm-ostree needs /var/tmp as scratch space, which the image may not have (/var is usually emptied)
        sudo podman run --rm \
          --platform=linux/${{ inputs.platform }} \
          --pull=never \
          --privileged \
          --security-opt=label=disable \
          -v /var/lib/containers:/var/lib/containers \
          -v /var/tmp:/var/tmp \
          --entrypoint=/usr/libexec/bootc-base-imagectl \
          $LABELED \
          rechunk $LABELED $RECHUNKED

        # Move the rechunked image out of root's storage, removing the originals to make space
        sudo podman rmi -f --ignore $LABELED $IMAGE_ID ${{ steps.build.outputs.image-id }}
        sudo skopeo copy --dest-oci-accept-uncompressed-layers containers-storage:$RECHUNKED oci:$OUT_DIR
        sudo podman rmi $RECHUNKED
        sudo chown $(id -u):$(id -g) -R $OUT_DIR

        echo "ref=oci:$OUT_DIR" >> $GITHUB_OUTPUT
        echo "location=$OUT_DIR" >> $GITHUB_OUTPUT
        echo "::endgroup::"

    - name: Upload ChangeLog
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
      with:
        name: changelog-${{ inputs.image-name }}-${{ env.CLEAN_ARCH }}
        retention-days: 1
        if-no-files-found: error
        path: |
          ${{ steps.changelog.outputs.changelog }}

    - name: Load Image
      id: load
      env:
        IMAGE_TAG: ${{ inputs.image-tag }}-${{ env.CLEAN_ARCH }}
      shell: bash
      run: |
        echo "::group::Load Image"
        ls -l ${{ steps.changelog.outputs.changelog }}
        cat ${{ steps.changelog.outputs.changelog }}
        if [ -s ${{ steps.changelog.outputs.changelog }} ]; then
          cat ${{ steps.changelog.outputs.changelog }} >> $GITHUB_STEP_SUMMARY
        fi

        IMAGE=$(podman pull ${{ steps.rechunk.outputs.ref }})
        sudo rm -rf ${{ steps.rechunk.outputs.location }}
        podman image tag $IMAGE ${{ inputs.image-name }}:${{ env.IMAGE_TAG }}

        IMAGE=${{ inputs.image-name }}:${{ env.IMAGE_TAG }}
        INSPECT=$(podman image inspect $IMAGE)
        echo "image=$IMAGE" >> $GITHUB_OUTPUT
        echo "digest=$(echo "$INSPECT" | jq -r '.[0].Digest')" >> $GITHUB_OUTPUT
        echo "image-id=$(echo "$INSPECT" | jq -r '("sha256:" + .[0].Id)')" >> $GITHUB_OUTPUT
        echo "redhat-id=$(echo "$INSPECT" | jq -r '.[0].Labels["redhat.id"]')" >> $GITHUB_OUTPUT
        echo "redhat-version-id=$(echo "$INSPECT" | jq -r '.[0].Labels["redhat.version-id"]')" >> $GITHUB_OUTPUT
        echo "redhat-major-version=$(echo "$INSPECT" | jq -r '.[0].Labels["redhat.major-version"]')" >> $GITHUB_OUTPUT
        echo "version=$(echo "$INSPECT" | jq -r '.[0].Labels["org.opencontainers.image.version"]')" >> $GITHUB_OUTPUT
        echo $INSPECT | jq .
        echo "::endgroup::"

    # Push the image to GHCR (Image Registry)
    - name: Push to Registry
      id: push
      env:
        IMAGE_TAG: ${{ inputs.image-tag }}-${{ env.CLEAN_ARCH }}
      shell: bash
      run: |
        echo "::group::Push to Registry"
        podman tag ${{ steps.load.outputs.image-id }} ${{ steps.set-env.outputs.image-ref }}:${{ env.IMAGE_TAG }}
        for i in {1..3}; do
          podman push --digestfile=/tmp/digestfile ${{ steps.set-env.outputs.image-ref }}:${{ env.IMAGE_TAG }} && break || sleep $((5 * i));
        done
        [ -f /tmp/digestfile ] || exit 1
        REMOTE_IMAGE_DIGEST=$(cat /tmp/digestfile)
        echo "digest=$REMOTE_IMAGE_DIGEST" >> $GITHUB_OUTPUT
        cat /tmp/digestfile
        echo "::endgroup::"

    - name: Create Job Outputs
      shell: bash
      run: |
        echo "::group::Create Job Outputs"
        mkdir -p /tmp/outputs/digests/
        jq -n --arg platform "${{ inputs.platform }}" \
          --arg digest "${{ steps.push.outputs.digest }}" \
          --arg redhat_version_id "${{ steps.load.outputs.redhat-version-id }}" \
          --arg version "${{ steps.load.outputs.version }}" \
          --arg image_id "${{ steps.load.outputs.image-id }}" \
          --arg major_version "${{ steps.load.outputs.redhat-major-version }}" \
          '{($platform): {digest: $digest, version: $version, redhat_version_id: $redhat_version_id, image_id: $image_id, major_version: $major_version}}' \
          > /tmp/outputs/digests/${{ inputs.image-name }}_${{ env.CLEAN_ARCH }}.json

        cat /tmp/outputs/digests/${{ inputs.image-name }}_${{ env.CLEAN_ARCH }}.json
        echo "::endgroup::"

    - name: Upload Output Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
      with:
        name: ${{ inputs.image-name }}_${{ env.CLEAN_ARCH }}
        retention-days: 1
        if-no-files-found: error
        path: |
          /tmp/outputs/digests/*.json
