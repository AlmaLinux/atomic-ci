---
name: Build ISO
description: Build a live ISO from a container image, with an installer for that image

inputs:
  platform:
    description: The platform to build the image for (e.g., "x86_64", "arm64")
    required: true
  image:
    description: Full podman image reference, including hash (e.g., "registry.example.com/image@sha256")
    required: true
  image-name:
    description: Name of the image, will be used to name the ISO file (e.g., "my-image")
    required: true
  update_is_signed:
    description: Whether the image is signed or not
    required: false
  update_origin_ref:
    description: Image reference to update from (e.g., "{image}:latest")
    required: true
  config-file:
    description: >-
      Path to the ISO configuration file. Only the kickstart ([customizations.installer.kickstart])
      is used, it's added to the kickstart of the installer
    required: false
  hook-script:
    description: Path to a script that runs at the end of the live image build, to customize the live environment
    required: false
  image-builder-image:
    description: The image-builder container image used to build the ISO
    required: false
    default: ghcr.io/osbuild/image-builder-cli:latest
  skip-maximize-build-space:
    description: Whether to skip maximizing build space
    required: false
  REGISTRY:
    description: The container registry URL (e.g., "registry.example.com")
    required: true
  REGISTRY_USER:
    description: The username for the container registry login
    required: true
  REGISTRY_TOKEN:
    description: The token for authenticating with the container registry
    required: true

outputs:
  output_directory:
    description: The directory where the built ISO and checksum are stored
    value: ${{ steps.rename.outputs.output_directory }}
  artifact_name:
    description: The name of the artifact (ISO file) without the extension
    value: ${{ steps.rename.outputs.ARTIFACT_NAME }}
  iso_name:
    description: The name of the built ISO file
    value: ${{ steps.rename.outputs.ISO_NAME }}
  checksum_name:
    description: The name of the checksum file for the ISO
    value: ${{ steps.rename.outputs.CHECKSUM_NAME }}

runs:
  using: "composite"
  steps:
    - name: Login to Container Registry
      uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
      with:
        registry: ${{ inputs.REGISTRY }}
        username: ${{ inputs.REGISTRY_USER }}
        password: ${{ inputs.REGISTRY_TOKEN }}

    - name: Set up environment
      id: set-env
      shell: bash
      run: |
        ARCH=${{ inputs.platform }}
        echo "CLEAN_ARCH=${ARCH//\//_}" >> "$GITHUB_ENV"

    - name: Maximize build space
      if: ${{ inputs.platform != 'arm64' && inputs.skip-maximize-build-space != 'true' }}
      uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # v10 when it gets tagged
      with:
        extra-squeeze: false

    - name: Prepare live image context
      id: context
      shell: bash
      env:
        CONFIG_FILE: ${{ inputs.config-file }}
        HOOK_SCRIPT: ${{ inputs.hook-script }}
        CONTEXT: ${{ runner.temp }}/live-iso
      run: |
        rm -rf "${CONTEXT}"
        mkdir -p "${CONTEXT}"
        cp ${{ github.action_path }}/live/* "${CONTEXT}/"

        if [[ -n "${CONFIG_FILE}" ]]; then
          [ "${{ inputs.update_is_signed }}" = "true" ] && SIG="--enforce-container-sigpolicy"

          # image-builder doesn't take a blueprint for this kind of ISO, the installer is configured
          # in the live image. Keep supporting the kickstart from the configuration file.
          python3 - "${CONFIG_FILE}" > "${CONTEXT}/kickstart.ks" <<'EOF'
        import sys, tomllib

        with open(sys.argv[1], "rb") as f:
            config = tomllib.load(f)

        customizations = config.get("customizations", {})
        installer = customizations.get("installer", {})
        print(installer.get("kickstart", {}).get("contents", ""))

        ignored = [f"customizations.{k}" for k in customizations if k != "installer"]
        ignored += [f"customizations.installer.{k}" for k in installer if k != "kickstart"]
        ignored += [k for k in config if k != "customizations"]
        if ignored:
            print(f"::warning::Not supported in live ISOs, ignoring from {sys.argv[1]}: {', '.join(ignored)}", file=sys.stderr)
        EOF

          sed -i 's#<UPDATE_IMAGE_REF>#${{ inputs.update_origin_ref }}#g' "${CONTEXT}/kickstart.ks"
          sed -i "s#<IMAGE_SIGNED>#${SIG}#g" "${CONTEXT}/kickstart.ks"
          cat "${CONTEXT}/kickstart.ks"
        fi

        if [[ -n "${HOOK_SCRIPT}" ]]; then
          cp "${HOOK_SCRIPT}" "${CONTEXT}/hook.sh"
        fi

        echo "context=${CONTEXT}" >> "${GITHUB_OUTPUT}"

    - name: Build live image
      id: live
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        LIVE_IMAGE: localhost/${{ inputs.image-name }}-live
        CONTEXT: ${{ steps.context.outputs.context }}
      run: |
        echo "::group::Pull image"
        # The registry login was done as the current user, but the image is needed in root's storage
        AUTHFILE="${REGISTRY_AUTH_FILE:-${XDG_RUNTIME_DIR}/containers/auth.json}"
        AUTH_ARGS=()
        if [[ -f "${AUTHFILE}" ]]; then
          AUTH_ARGS=(--authfile "${AUTHFILE}")
        fi
        # The image is embedded in the ISO, so it can be installed without a network connection
        sudo podman pull "${AUTH_ARGS[@]}" --platform=linux/${{ inputs.platform }} "${IMAGE}"
        echo "::endgroup::"

        echo "::group::Build live image"
        sudo podman build \
          --platform=linux/${{ inputs.platform }} \
          --pull=never \
          --cap-add=sys_admin \
          --security-opt=label=disable \
          --build-arg IMAGE_REF="${IMAGE}" \
          --build-arg UPDATE_IMAGE_REF="${{ inputs.update_origin_ref }}" \
          --build-arg ISO_NAME="${{ inputs.image-name }}" \
          --build-arg ISO_LABEL="" \
          -t "${LIVE_IMAGE}" \
          -f "${CONTEXT}/Containerfile" \
          "${CONTEXT}"
        echo "live-image=${LIVE_IMAGE}" >> "${GITHUB_OUTPUT}"
        echo "::endgroup::"

    - name: Build ISO
      id: build
      shell: bash
      env:
        OUTPUT: ${{ runner.temp }}/iso-output
      run: |
        echo "::group::Build ISO"
        mkdir -p "${OUTPUT}"
        sudo podman run \
          --rm \
          --privileged \
          --pull=newer \
          --security-opt label=type:unconfined_t \
          -v "${OUTPUT}":/output \
          -v /var/lib/containers/storage:/var/lib/containers/storage \
          ${{ inputs.image-builder-image }} \
          build \
          --progress verbose \
          --output-dir /output \
          --bootc-ref "${{ steps.live.outputs.live-image }}" \
          --bootc-installer-payload-ref "${{ inputs.image }}" \
          bootc-generic-iso
        sudo chown -R "$(id -u):$(id -g)" "${OUTPUT}"

        # Make space for the uploads
        sudo podman rmi -f "${{ steps.live.outputs.live-image }}" "${{ inputs.image }}"

        ISO="$(find "${OUTPUT}" -name '*.iso' | head -1)"
        [[ -f "${ISO}" ]] || { echo "::error::No ISO found in ${OUTPUT}"; exit 1; }
        ls -lh "${ISO}"
        echo "output-path=${ISO}" >> "${GITHUB_OUTPUT}"
        echo "::endgroup::"

    - name: Rename ISO
      id: rename
      env:
        OUTPUT_PATH: output-${{ env.CLEAN_ARCH }}
      shell: bash
      run: |
        set -x
        mkdir -p ${{ env.OUTPUT_PATH }}
        OUTPUT_DIRECTORY="$(realpath ${{ env.OUTPUT_PATH }})"

        ARTIFACT_NAME="${{ inputs.image-name }}-${{ env.CLEAN_ARCH }}"
        ISO_NAME="${ARTIFACT_NAME}.iso"
        CHECKSUM_NAME="${ISO_NAME}-CHECKSUM"

        mv ${{ steps.build.outputs.output-path }} "${OUTPUT_DIRECTORY}/${ISO_NAME}"
        (cd "${OUTPUT_DIRECTORY}" && sha256sum "${ISO_NAME}" > "${CHECKSUM_NAME}")

        echo "output_directory=$OUTPUT_DIRECTORY" >> "${GITHUB_OUTPUT}"
        echo "ISO_NAME=${ISO_NAME}" >> "${GITHUB_OUTPUT}"
        echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"
        echo "CHECKSUM_NAME=${CHECKSUM_NAME}" >> "${GITHUB_OUTPUT}"
