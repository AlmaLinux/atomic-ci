---
name: Build ISO

inputs:
  platform:
    description: The platform to build the image for (e.g., "x86_64", "arm64")
    required: true
  image:
    description: Full podman image reference of the bootable container to install, including hash (e.g., "registry.example.com/image@sha256")
    required: true
  image-name:
    description: Name of the image, will be used to name the ISO file (e.g., "my-image")
    required: true
  installer-image:
    description: Full podman image reference of the installer environment, including hash. Must be a bootable container that contains Anaconda (e.g., "registry.example.com/installer@sha256")
    required: true
  update_is_signed:
    description: Whether the image is signed or not
    required: false
  update_origin_ref:
    description: Image reference to update from (e.g., "{image}:latest")
    required: true
  config-file:
    description: Path to the ISO configuration file
    required: true
  use_librepo:
    description: "Use librepo to download the image"
    required: false
  REGISTRY:
    description: The container registry URL (e.g., "registry.example.com")
    required: true
  REGISTRY_USER:
    description: The username for the container registry login
    required: true
  REGISTRY_TOKEN:
    description: The token for authenticating with the container registry
    required: true

outputs:
  output_directory:
    description: The directory where the built ISO and checksum are stored
    value: ${{ steps.rename.outputs.output_directory }}
  artifact_name:
    description: The name of the artifact (ISO file) without the extension
    value: ${{ steps.rename.outputs.ARTIFACT_NAME }}
  iso_name:
    description: The name of the built ISO file
    value: ${{ steps.rename.outputs.ISO_NAME }}
  checksum_name:
    description: The name of the checksum file for the ISO
    value: ${{ steps.rename.outputs.CHECKSUM_NAME }}

runs:
  using: "composite"
  steps:
    - name: Login to Container Registry
      uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
      with:
        registry: ${{ inputs.REGISTRY }}
        username: ${{ inputs.REGISTRY_USER }}
        password: ${{ inputs.REGISTRY_TOKEN }}

    - name: Set up environment
      id: set-env
      shell: bash
      run: |
        ARCH=${{ inputs.platform }}
        echo "CLEAN_ARCH=${ARCH//\//_}" >> "$GITHUB_ENV"

    - name: Prepare ISO configuration
      shell: bash
      run: |
        [ "${{ inputs.update_is_signed }}" = "true" ] && SIG="--enforce-container-sigpolicy"

        sed -i 's#<UPDATE_IMAGE_REF>#${{ inputs.update_origin_ref }}#g' ${{ inputs.config-file }}
        sed -i "s#<IMAGE_SIGNED>#${SIG}#g" ${{ inputs.config-file }}
        cat ${{ inputs.config-file }}

    - name: Build ISO
      id: build
      env:
        CONFIG_FILE: ${{ inputs.config-file }}
        INSTALLER_IMAGE: ${{ inputs.installer-image }}
        IMAGE: ${{ inputs.image }}
        IMAGE_BUILDER_IMAGE: ghcr.io/osbuild/image-builder-cli:latest
        PLATFORM: linux/${{ inputs.platform }}
      shell: bash
      run: |
        set -eux

        CONFIG_FILE_EXTENSION="${CONFIG_FILE##*.}"

        USE_LIBREPO=false
        [ "${{ inputs.use_librepo }}" = "true" ] && USE_LIBREPO=true

        mkdir -p output

        sudo podman pull --platform "${PLATFORM}" "${INSTALLER_IMAGE}"
        sudo podman pull --platform "${PLATFORM}" "${IMAGE}"

        sudo podman run \
          --rm \
          --privileged \
          --platform "${PLATFORM}" \
          --security-opt label=type:unconfined_t \
          -v "$(realpath "${CONFIG_FILE}"):/config.${CONFIG_FILE_EXTENSION}:ro" \
          -v "${PWD}/output:/output" \
          -v /var/lib/containers/storage:/var/lib/containers/storage \
          "${IMAGE_BUILDER_IMAGE}" \
          build \
            --bootc-ref "${INSTALLER_IMAGE}" \
            --bootc-installer-payload-ref "${IMAGE}" \
            --blueprint "/config.${CONFIG_FILE_EXTENSION}" \
            --output-dir /output \
            --output-name "${{ inputs.image-name }}-${CLEAN_ARCH}" \
            --use-librepo=${USE_LIBREPO} \
            bootc-installer

        sudo chown -R "$(id -u):$(id -g)" output

    - name: Rename ISO
      id: rename
      env:
        OUTPUT_PATH: output-${{ env.CLEAN_ARCH }}
      shell: bash
      run: |
        set -x
        mkdir -p "${OUTPUT_PATH}"
        OUTPUT_DIRECTORY="$(realpath "${OUTPUT_PATH}")"

        ARTIFACT_NAME="${{ inputs.image-name }}-${{ env.CLEAN_ARCH }}"
        ISO_NAME="${ARTIFACT_NAME}.iso"
        CHECKSUM_NAME="${ISO_NAME}-CHECKSUM"

        mv "output/${ISO_NAME}" "${OUTPUT_DIRECTORY}/${ISO_NAME}"
        sha256sum "${OUTPUT_DIRECTORY}/${ISO_NAME}" | awk '{print $1}' > "${OUTPUT_DIRECTORY}/${CHECKSUM_NAME}"

        echo "output_directory=${OUTPUT_DIRECTORY}" >> "${GITHUB_OUTPUT}"
        echo "ISO_NAME=${ISO_NAME}" >> "${GITHUB_OUTPUT}"
        echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"
        echo "CHECKSUM_NAME=${CHECKSUM_NAME}" >> "${GITHUB_OUTPUT}"
