---
name: Build ISO
description: Build a live ISO from a container image, with an installer for that image

inputs:
  platform:
    description: The platform to build the image for (e.g., "x86_64", "arm64")
    required: true
  image:
    description: Full podman image reference, including hash (e.g., "registry.example.com/image@sha256")
    required: true
  image-name:
    description: Name of the image, will be used to name the ISO file (e.g., "my-image")
    required: true
  update-origin-ref:
    description: Image reference to update from (e.g., "{image}:latest")
    required: true
  hook-script:
    description: >-
      Path to a script that runs at the end of the live image build, to customize the live environment
      or the installer
    required: false
  image-builder-image:
    description: The image-builder container image used to build the ISO
    required: false
    default: ghcr.io/osbuild/image-builder-cli:latest
  skip-maximize-build-space:
    description: Whether to skip maximizing build space
    required: false
  REGISTRY:
    description: The container registry URL (e.g., "registry.example.com")
    required: true
  REGISTRY_USER:
    description: The username for the container registry login
    required: true
  REGISTRY_TOKEN:
    description: The token for authenticating with the container registry
    required: true

outputs:
  output-directory:
    description: The directory where the built ISO and checksum are stored
    value: ${{ steps.rename.outputs.output_directory }}
  artifact-name:
    description: The name of the artifact (ISO file) without the extension
    value: ${{ steps.rename.outputs.ARTIFACT_NAME }}
  iso-name:
    description: The name of the built ISO file
    value: ${{ steps.rename.outputs.ISO_NAME }}
  checksum-name:
    description: The name of the checksum file for the ISO
    value: ${{ steps.rename.outputs.CHECKSUM_NAME }}

runs:
  using: "composite"
  steps:
    - name: Login to Container Registry
      uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
      with:
        registry: ${{ inputs.REGISTRY }}
        username: ${{ inputs.REGISTRY_USER }}
        password: ${{ inputs.REGISTRY_TOKEN }}

    - name: Set up environment
      id: set-env
      env:
        PLATFORM: ${{ inputs.platform }}
      shell: bash
      run: |
        ARCH=${PLATFORM}
        echo "CLEAN_ARCH=${ARCH//\//_}" >> "$GITHUB_ENV"

    - name: Maximize build space
      if: ${{ inputs.platform != 'arm64' && inputs.skip-maximize-build-space != 'true' }}
      uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # v10 when it gets tagged
      with:
        extra-squeeze: false

    # Ubuntu 26.04 ships the bwrap-userns-restrict AppArmor profile. It applies to /usr/bin/bwrap
    # by path, also inside a privileged container, and moves everything bwrap starts to a profile
    # without capabilities. osbuild runs its stages with bwrap, so they can't chown or mount and
    # the ISO build fails with "mount: /run/osbuild/containers/storage: permission denied".
    # This is the override the bootc project uses in its own CI (bootc-dev/actions#55): it keeps
    # what bwrap starts in the profile of bwrap itself. AppArmor stays enabled, and nothing is
    # done in runners without this profile.
    - name: Allow bwrap to keep its capabilities
      shell: bash
      run: |
        if sudo test -r /etc/apparmor.d/bwrap-userns-restrict &&
           sudo test -r /sys/kernel/security/apparmor/profiles &&
           sudo grep -qx 'bwrap (enforce)' /sys/kernel/security/apparmor/profiles; then
          printf '%s\n' 'priority=100 allow file rwlkm /**,' 'priority=100 allow ix /**,' \
            | sudo tee /etc/apparmor.d/local/bwrap-userns-restrict > /dev/null
          sudo apparmor_parser -Q /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          echo "AppArmor override for bwrap installed"
        else
          echo "The bwrap-userns-restrict AppArmor profile is not enforced in this runner, nothing to do"
        fi

    - name: Prepare live image context
      id: context
      shell: bash
      env:
        HOOK_SCRIPT: ${{ inputs.hook-script }}
        CONTEXT: ${{ runner.temp }}/live-iso
      run: |
        rm -rf "${CONTEXT}"
        mkdir -p "${CONTEXT}"
        cp ${{ github.action_path }}/live/* "${CONTEXT}/"

        if [[ -n "${HOOK_SCRIPT}" ]]; then
          cp "${HOOK_SCRIPT}" "${CONTEXT}/hook.sh"
        fi

        echo "context=${CONTEXT}" >> "${GITHUB_OUTPUT}"

    - name: Build live image
      id: live
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        LIVE_IMAGE: localhost/${{ inputs.image-name }}-live
        CONTEXT: ${{ steps.context.outputs.context }}
        PLATFORM: ${{ inputs.platform }}
        UPDATE_ORIGIN_REF: ${{ inputs.update-origin-ref }}
        IMAGE_NAME: ${{ inputs.image-name }}
      run: |
        echo "::group::Pull image"
        # The registry login was done as the current user, but the image is needed in root's storage
        AUTHFILE="${REGISTRY_AUTH_FILE:-${XDG_RUNTIME_DIR}/containers/auth.json}"
        AUTH_ARGS=()
        if [[ -f "${AUTHFILE}" ]]; then
          AUTH_ARGS=(--authfile "${AUTHFILE}")
        fi
        # The image is embedded in the ISO, so it can be installed without a network connection
        # Keep the ID: for platforms with a variant (amd64/v2), podman doesn't find the image by its
        # name when given --platform, as the image doesn't record the variant
        IMAGE_ID=$(sudo podman pull --quiet "${AUTH_ARGS[@]}" --platform=linux/${PLATFORM} "${IMAGE}")
        echo "::endgroup::"

        echo "::group::Build live image"
        sudo podman build \
          --platform=linux/${PLATFORM} \
          --pull=never \
          --cap-add=sys_admin \
          --security-opt=label=disable \
          --build-arg BASE_IMAGE="${IMAGE_ID}" \
          --build-arg IMAGE_REF="${IMAGE}" \
          --build-arg UPDATE_IMAGE_REF="${UPDATE_ORIGIN_REF}" \
          --build-arg ISO_NAME="${IMAGE_NAME}" \
          --build-arg ISO_LABEL="" \
          -t "${LIVE_IMAGE}" \
          --iidfile "${RUNNER_TEMP}/live-image-id" \
          -f "${CONTEXT}/Containerfile" \
          "${CONTEXT}"
        echo "live-image=${LIVE_IMAGE}" >> "${GITHUB_OUTPUT}"
        echo "live-image-id=$(cat "${RUNNER_TEMP}/live-image-id")" >> "${GITHUB_OUTPUT}"
        echo "image-id=${IMAGE_ID}" >> "${GITHUB_OUTPUT}"
        echo "::endgroup::"

    - name: Build ISO
      id: build
      shell: bash
      env:
        OUTPUT: ${{ runner.temp }}/iso-output
        IMAGE_BUILDER_IMAGE: ${{ inputs.image-builder-image }}
        IMAGE: ${{ inputs.image }}
      run: |
        echo "::group::Build ISO"
        mkdir -p "${OUTPUT}"
        # image-builder takes the images by name: the one to install is stored in the ISO under
        # that name, which is how the installer refers to it. It looks them up without a platform.
        # The manifest and the build log are written to the output directory, and uploaded by the
        # next step if the build fails. The metrics are the time each stage took, printed at the end.
        RC=0
        sudo podman run \
          --rm \
          --privileged \
          --pull=newer \
          --security-opt label=type:unconfined_t \
          -v "${OUTPUT}":/output \
          -v /var/lib/containers/storage:/var/lib/containers/storage \
          "${IMAGE_BUILDER_IMAGE}" \
          build \
          --progress verbose \
          --output-dir /output \
          --with-manifest \
          --with-buildlog \
          --with-metrics \
          --bootc-ref "${{ steps.live.outputs.live-image }}" \
          --bootc-installer-payload-ref "${IMAGE}" \
          bootc-generic-iso || RC=$?
        # Also when the build fails, so the diagnostics can be uploaded
        sudo chown -R "$(id -u):$(id -g)" "${OUTPUT}"
        if [[ $RC -ne 0 ]]; then
          echo "::error::The ISO build failed, the build log and the manifest are uploaded as an artifact of this run"
          exit $RC
        fi

        # Make space for the uploads
        sudo podman rmi -f "${{ steps.live.outputs.live-image-id }}" "${{ steps.live.outputs.image-id }}"

        ISO="$(find "${OUTPUT}" -name '*.iso' | head -1)"
        [[ -f "${ISO}" ]] || { echo "::error::No ISO found in ${OUTPUT}"; exit 1; }
        ls -lh "${ISO}"
        echo "output-path=${ISO}" >> "${GITHUB_OUTPUT}"
        echo "::endgroup::"

    - name: Upload ISO build diagnostics
      if: ${{ failure() && steps.build.outcome == 'failure' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: iso-build-diagnostics-${{ inputs.image-name }}-${{ env.CLEAN_ARCH }}
        retention-days: 7
        if-no-files-found: warn
        path: |
          ${{ runner.temp }}/iso-output/*.buildlog
          ${{ runner.temp }}/iso-output/*.osbuild-manifest.json

    - name: Rename ISO
      id: rename
      env:
        OUTPUT_PATH: output-${{ env.CLEAN_ARCH }}
        IMAGE_NAME: ${{ inputs.image-name }}
      shell: bash
      run: |
        set -x
        mkdir -p ${{ env.OUTPUT_PATH }}
        OUTPUT_DIRECTORY="$(realpath ${{ env.OUTPUT_PATH }})"

        ARTIFACT_NAME="${IMAGE_NAME}-${{ env.CLEAN_ARCH }}"
        ISO_NAME="${ARTIFACT_NAME}.iso"
        CHECKSUM_NAME="${ISO_NAME}-CHECKSUM"

        mv ${{ steps.build.outputs.output-path }} "${OUTPUT_DIRECTORY}/${ISO_NAME}"
        (cd "${OUTPUT_DIRECTORY}" && sha256sum "${ISO_NAME}" > "${CHECKSUM_NAME}")

        echo "output_directory=$OUTPUT_DIRECTORY" >> "${GITHUB_OUTPUT}"
        echo "ISO_NAME=${ISO_NAME}" >> "${GITHUB_OUTPUT}"
        echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"
        echo "CHECKSUM_NAME=${CHECKSUM_NAME}" >> "${GITHUB_OUTPUT}"
